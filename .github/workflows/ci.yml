name: Rust
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workspace:
    name: Workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Documentation tests
        run: cargo test --workspace --doc --locked --offline
      - name: Native tests
        run: cargo nextest run --workspace --profile ci --locked --offline --no-fail-fast
      - name: Verify dependency metadata
        run: cargo metadata --format-version 1 --locked --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
  xfs:
    name: XFS naming modes
    # Keep a kernel/userspace combination that supports the deprecated ASCII-CI
    # format; the main matrix separately tests current Linux hosts.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - name: Install XFS fixture tools
        run: sudo apt-get update -qq && sudo apt-get install -y xfsprogs
      - name: Test native XFS naming modes
        shell: bash
        run: |
          set -euo pipefail
          fixture_root=$(mktemp -d "$RUNNER_TEMP/policy-xfs.XXXXXX")
          mkdir "$fixture_root/exact" "$fixture_root/insensitive"
          trap 'sudo umount "$fixture_root/insensitive" 2>/dev/null || true; sudo umount "$fixture_root/exact" 2>/dev/null || true' EXIT
          truncate -s 512M "$fixture_root/exact.img"
          truncate -s 512M "$fixture_root/insensitive.img"
          mkfs.xfs -f "$fixture_root/exact.img"
          mkfs.xfs -f -m crc=0 -n version=ci "$fixture_root/insensitive.img"
          sudo mount -o loop "$fixture_root/exact.img" "$fixture_root/exact"
          sudo mount -o loop "$fixture_root/insensitive.img" "$fixture_root/insensitive"
          sudo chown "$(id -u):$(id -g)" "$fixture_root/exact" "$fixture_root/insensitive"
          cargo fetch --locked
          POLICY_NORMALIZER_XFS_ROOT="$fixture_root" cargo nextest run -p policy-normalizer --test xfs --run-ignored only --profile xfs --locked --offline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-xfs
          path: target/nextest/xfs/junit.xml
